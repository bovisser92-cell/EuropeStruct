<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123a63"/>
      <stop offset="100%" stop-color="#081a30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c78a20"/>
      <stop offset="100%" stop-color="#eec877"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- ascending skyline / buildings -->
  <rect x="21" y="46" width="13" height="32" rx="2" fill="url(#gold)"/>
  <rect x="43" y="30" width="13" height="48" rx="2" fill="url(#gold)"/>
  <rect x="65" y="14" width="13" height="64" rx="2" fill="url(#gold)"/>

  <!-- windows -->
  <g fill="#0b2545" fill-opacity=".85">
    <rect x="25" y="53" width="5" height="5"/>
    <rect x="25" y="63" width="5" height="5"/>
    <rect x="47" y="37" width="5" height="5"/>
    <rect x="47" y="47" width="5" height="5"/>
    <rect x="47" y="57" width="5" height="5"/>
    <rect x="69" y="21" width="5" height="5"/>
    <rect x="69" y="31" width="5" height="5"/>
    <rect x="69" y="41" width="5" height="5"/>
    <rect x="69" y="51" width="5" height="5"/>
  </g>

  <!-- crane accent -->
  <path d="M65 14 L65 6 L84 6" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="84" y1="6" x2="84" y2="12" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- foundation line -->
  <rect x="17" y="82" width="66" height="4" rx="2" fill="url(#gold)"/>
</svg>
